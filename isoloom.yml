# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# Log4j (Google's 2022 security competition, by Google; a web challenge) as an Isoloom spec:
# a Flask chat page that runs a Java chatbot logging every message with Log4j 2, which holds the flag in its environment.
# The challenge folder 2022/quals/web-log4j of Google's challenge archive is vendored unchanged in build/web/app/ and built by the overlay Dockerfile next to it.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: google-ctf-2022-log4j

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: {}

networks:
  lab: {cidr: 10.60.170.0/24, internet: false}

machines:
  web:
    networks: {lab: 10}
    resources: {cpus: 1, memory_mb: 1024}
    privileged: true  # the image's setup script mounts /proc and nsjail creates namespaces
    volumes: {ctf: /chroot/ctf}     # the flag, written by ctf/flag.sh at every start
    ports:
      web:
        port: 1337
        protocol: http
        publish: true
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      build: build/web

checks:
  - name: the web service answers
    http: http://web:1337/
    expect: any
    wait: 120
  - name: the chatbot repeats a message sent with its /repeat command
    script: checks/probe.sh
    wait: 120

message: |
  Log4j (Google, 2022) answers at {{ machines.web.ports.web.url }}.
  Commands start with a slash, as in /help. Everything you send is logged by Log4j: what can a lookup read without JNDI?
